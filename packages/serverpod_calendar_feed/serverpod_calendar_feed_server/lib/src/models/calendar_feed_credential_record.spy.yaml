class: CalendarFeedCredentialRecord
serverOnly: true
table: serverpod_calendar_feed_credential
fields:
  id: UuidValue?, defaultPersist=random
  feedId: UuidValue, relation(parent=serverpod_calendar_feed_identity)
  digestVersion: int
  digest: String
  label: String?
  revision: int
  createdAt: DateTime
  revokedAt: DateTime?
indexes:
  calendar_feed_credential_digest_unique:
    fields: digestVersion, digest
    unique: true
  calendar_feed_credential_parent_idx:
    fields: feedId
