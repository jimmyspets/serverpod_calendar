class: CalendarAvailabilityDataRecord
serverOnly: true
table: serverpod_calendar_availability_data
fields:
  availabilityId: UuidValue, relation(parent=serverpod_calendar_availability)
  protocolUid: String
  calendarId: UuidValue, relation(parent=serverpod_calendar_identity)
  uidDigest: String
  protocolState: CalendarAvailabilityProtocolState?
  importBaseline: CalendarAvailabilityImportBaseline?
  timingOverrides: List<CalendarAvailabilityOpeningEdits>?
  content: CalendarAvailabilityContent
  createdAt: DateTime
  updatedAt: DateTime
indexes:
  calendar_availability_data_identity_unique:
    fields: availabilityId
    unique: true
  calendar_availability_data_uid_candidates:
    fields: calendarId, uidDigest
