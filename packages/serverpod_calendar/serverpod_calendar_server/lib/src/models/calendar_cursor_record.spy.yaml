class: CalendarCursorRecord
serverOnly: true
table: serverpod_calendar_cursor
fields:
  token: String
  scopeKey: String
  principalId: String
  policyRevision: String
  dataRevision: int
  afterId: UuidValue
  pageSize: int
  fieldGroups: List<CalendarFieldGroup>
  taskCalendarId: UuidValue?
  taskFieldGroups: List<CalendarTaskFieldGroup>?
  eventCalendarId: UuidValue?
  eventFieldGroups: List<CalendarEventFieldGroup>?
  eventOccurrenceState: CalendarEventOccurrenceCursorState?
  categoryFilter: CalendarCategoryFilter?
  alarmActivityId: UuidValue?
  alarmActivityKind: CalendarAlarmActivityKind?
  expiresAt: DateTime
  taskHistoryTaskId: UuidValue?
  taskHistoryOriginalKey: String?
  taskHistoryAfterRevision: int?
indexes:
  calendar_cursor_token_unique:
    fields: token
    unique: true
  calendar_cursor_expiry_idx:
    fields: expiresAt
