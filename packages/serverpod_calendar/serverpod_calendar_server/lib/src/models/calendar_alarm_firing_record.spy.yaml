class: CalendarAlarmFiringRecord
serverOnly: true
table: serverpod_calendar_alarm_firing
fields:
  id: UuidValue?, defaultPersist=random
  alarmId: UuidValue, relation(parent=serverpod_calendar_alarm)
  generation: int
  originalKey: String
  kind: CalendarAlarmFiringKind
  repeatOrdinal: int
  snoozeRevision: int, default=0
  dueAt: DateTime
  expiresAt: DateTime
  state: CalendarAlarmFiringState, default=pending
  reason: String?
  nextAttemptAt: DateTime
  attemptCount: int, default=0
  acceptedAt: DateTime?
  terminalAt: DateTime?
  leaseOwner: UuidValue?
  leaseUntil: DateTime?
  leaseFence: int, default=0
  createdAt: DateTime
  updatedAt: DateTime
indexes:
  calendar_alarm_firing_identity_unique:
    fields: alarmId, generation, originalKey, kind, repeatOrdinal, snoozeRevision
    unique: true
  calendar_alarm_firing_due_idx:
    fields: state, nextAttemptAt, leaseUntil
  calendar_alarm_firing_terminal_idx:
    fields: terminalAt
