class: CalendarEventDataRecord
serverOnly: true
table: serverpod_calendar_event_data
fields:
  eventId: UuidValue, relation(parent=serverpod_calendar_event)
  calendarId: UuidValue
  protocolUid: String
  uidDigest: String
  protocolState: CalendarEventProtocolState?
  importBaseline: CalendarEventImportBaseline?
  timingOverrides: CalendarEventTimingOverrides?
  content: CalendarEventContent
  createdAt: DateTime
  updatedAt: DateTime
indexes:
  calendar_event_data_identity_unique:
    fields: eventId
    unique: true
  calendar_event_data_uid_candidates:
    fields: calendarId, uidDigest
