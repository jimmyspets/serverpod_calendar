class: CalendarTaskOccurrenceRecord
serverOnly: true
table: serverpod_calendar_task_occurrence
fields:
  taskId: UuidValue, relation(parent=serverpod_calendar_task)
  originalKey: String
  originalStart: CalendarEventTiming
  replacementTiming: CalendarTaskTiming?
  futureTiming: CalendarTaskTiming?
  contentOverrides: CalendarTaskOccurrenceContent?
  progress: CalendarTaskProgress
  protocolVersion: CalendarTaskProtocolVersion?
indexes:
  calendar_task_occurrence_identity_unique:
    fields: taskId, originalKey
    unique: true
