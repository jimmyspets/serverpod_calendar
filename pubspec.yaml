name: serverpod_calendar_workspace
publish_to: none
environment:
  sdk: '>=3.13.5 <3.14.0'
workspace:
  - packages/serverpod_calendar_core
  - packages/serverpod_calendar_icalendar
  - packages/serverpod_calendar/serverpod_calendar_server
  - packages/serverpod_calendar/serverpod_calendar_client
  - packages/serverpod_notifications/serverpod_notifications_server
  - packages/serverpod_notifications/serverpod_notifications_client
  - example/calendar_example/calendar_example_server
  - example/calendar_example/calendar_example_client
  - example/calendar_example/calendar_example_flutter
dev_dependencies:
  lints: 6.1.0
  calendar_example_client:
    path: example/calendar_example/calendar_example_client
  serverpod_auth_core_client: 4.0.4
  yaml: 3.1.3
